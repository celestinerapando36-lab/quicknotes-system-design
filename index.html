<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p class="subtitle">A small client that talks to a REST API (GET, POST, DELETE).</p>
  </header>

  <main>
    <section aria-labelledby="load-heading">
      <h2 id="load-heading">Load notes</h2>
      <button id="load-btn" type="button">Load notes</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section aria-labelledby="new-heading">
      <h2 id="new-heading">New note</h2>
      <form id="note-form" novalidate>
        <label for="title-input">Title (required, maximum 100 characters)</label>
        <input type="text" id="title-input" name="title" autocomplete="off">

        <label for="body-input">Body</label>
        <textarea id="body-input" name="body" rows="4"></textarea>

        <button type="submit" id="submit-btn">Add note</button>
      </form>
    </section>

    <section aria-labelledby="list-heading">
      <h2 id="list-heading">Notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </main>
</body>
</html>
